name: 'Publish Tauri Android'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: set NDK environment
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: install NPM dependencies
        run: npm install

      - name: Init Android
        run: npm run tauri android init

      - name: build tauri android
        run: npm run tauri android build -- --apk
      
      - name: Sign and Rename APK
        run: |
          # Generate a temporary keystore
          keytool -genkey -v -keystore release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=WMAX, CN=WMAX Release" -storepass android -keypass android
          
          # Sign the unsigned APK
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:android --key-pass pass:android src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          
          mkdir -p release_assets
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk release_assets/wmax-android.apk

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/wmax-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
