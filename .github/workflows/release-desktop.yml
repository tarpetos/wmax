name: 'Publish Tauri App'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'macos-aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'macos-x86_64'
          - platform: 'ubuntu-22.04'
            args: ''
            arch: 'linux-amd64'
          - platform: 'windows-latest'
            args: ''
            arch: 'windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install NPM dependencies
        run: npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        id: tauri
        with:
          args: ${{ matrix.args }}

      - name: Rename and Upload Artifacts (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p release_assets
          # Find and copy binaries
          find src-tauri/target -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) | while read file; do
            ext="${file##*.}"
            cp "$file" "release_assets/wmax-${{ matrix.arch }}.$ext"
          done
          # Copy raw binary for Linux to avoid AppImage bundling issues on Arch
          if [ "${{ matrix.platform }}" == "ubuntu-22.04" ]; then
            cp src-tauri/target/release/wmax release_assets/wmax-${{ matrix.arch }}
          fi
        
      - name: Rename and Upload Artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release_assets
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) | while read file; do
            ext="${file##*.}"
            cp "$file" "release_assets/wmax-${{ matrix.arch }}.$ext"
          done

      - name: Release Files
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
