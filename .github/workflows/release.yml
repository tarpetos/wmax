name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=wmax
      - name: Run ruff
        run: uv run ruff check .

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: wmax-linux
            executable_name: wmax-linux
            separator: ":"
            extra_args: ""
          - os: macos-latest
            artifact_name: wmax-macos
            executable_name: wmax-macos
            separator: ":"
            extra_args: ""
          - os: windows-latest
            artifact_name: wmax-windows.exe
            executable_name: wmax-windows.exe
            separator: ";"
            extra_args: "-w"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync
      - name: Build with PyInstaller
        run: >
          uv run pyinstaller --name ${{ matrix.executable_name }}
          --onefile
          ${{ matrix.extra_args }}
          --icon=wmax/static/favicon.ico
          --add-data "wmax/static${{ matrix.separator }}static"
          main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable_name }}

  build-arch:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python curl gcc
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: ~/.cargo/bin/uv sync || ~/.local/bin/uv sync
      - name: Build with PyInstaller
        run: >
          ~/.cargo/bin/uv run pyinstaller --name wmax-archlinux
          --onefile
          --icon=wmax/static/favicon.ico
          --add-data "wmax/static:static"
          main.py || ~/.local/bin/uv run pyinstaller --name wmax-archlinux --onefile --icon=wmax/static/favicon.ico --add-data "wmax/static:static" main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmax-archlinux
          path: dist/wmax-archlinux

  release:
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
