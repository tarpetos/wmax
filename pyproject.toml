[project]
name = "wmax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "tarpetos", email = "hevlichtaras@gmail.com" }]
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastapi==0.141.1",
    "loguru==0.7.3",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pystray==0.19.5",
    "uvicorn==0.52.0",
]


[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "pyinstaller==6.21.0",
    "httpx==0.28.1",
]


[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "tests",
]
builtins = ["_"]

[tool.ruff.lint]
ignore = [
    "ANN002", "ANN003", "ANN204",
    "BLE001",
    "COM812",
    "CPY001", "PTH", "T201", "SLF001", "SIM108", "FAST001",
    "D",
    "DTZ005",
    "EM101", "EM102",
    "G004",
    "FBT001", "FBT002", "FBT003",
    "FIX001", "FIX002",
    "N802",
    "PLR2004",
    "S101", "S311",
    "TD001", "TD002", "TD003", "TD004", "TD005",
    "TRY002", "TRY003", "TRY400",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLC0415", "I001"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
