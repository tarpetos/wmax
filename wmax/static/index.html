<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMAX - Maximum Weight Calculator</title>
    <meta name="description" content="Advanced calculator for your One Rep Max (1RM).">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <main class="app-container">
        <header class="app-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 18h12"></path>
                    <path d="M6 14h12"></path>
                    <rect x="2" y="10" width="20" height="12" rx="2"></rect>
                    <path d="M12 10V2"></path>
                    <path d="M8 2h8"></path>
                </svg>
            </div>
            <h1>WMAX</h1>
            <p>One Rep Max Calculator</p>
        </header>

        <form id="calc-form" class="calc-form">
            <div class="input-group">
                <label for="weight">Weight lifted</label>
                <div class="input-wrapper">
                    <input type="number" id="weight" value="100" min="1" max="500" step="0.1" required>
                    <span class="unit">kg</span>
                </div>
            </div>

            <div class="input-group">
                <label for="reps">Repetitions</label>
                <div class="input-wrapper">
                    <input type="number" id="reps" value="6" min="1" max="100" step="1" required>
                    <span class="unit">reps</span>
                </div>
            </div>

            <div class="input-group">
                <label for="mode">Muscle Profile</label>
                <div class="select-wrapper">
                    <select id="mode">
                        <option value="0">Power</option>
                        <option value="1" selected>Average</option>
                        <option value="2">Endurance</option>
                    </select>
                    <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>
            
            <button type="submit" class="btn-primary" id="calc-btn">
                <span>Calculate Max</span>
            </button>
        </form>

        <div id="result-box" class="result-box">
            <h3>Your 1RM is</h3>
            <div class="result-value">
                <span id="max-result">--</span>
                <span class="result-unit">kg</span>
            </div>
        </div>
        <div id="error-box" class="error-box"></div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
